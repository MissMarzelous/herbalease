<body>

    <header class="bg-success text-white text-center p-4">
        <h1>HerbalEASE Discussion Forum</h1>
        <p>Join the conversation and share your thoughts</p>
    </header>

    <section id="forum" class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <h2>Recent Posts</h2>
                <div id="postList"></div>
            </div>
            <div class="col-md-4">
                <h2>Create a New Post</h2>
                <form id="createPostForm">
                    <div class="form-group">
                        <label for="postTitle">Title:</label>
                        <input type="text" class="form-control" id="postTitle" placeholder="Enter title" required>
                    </div>
                    <div class="form-group">
                        <label for="postAuthor">Posting as:</label>
                        <input type="text" class="form-control" id="postAuthor" placeholder="Log in to post" readonly>
                    </div>
                    <div class="form-group">
                        <label for="postContent">Content:</label>
                        <textarea class="form-control" id="postContent" placeholder="Enter content" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Post</button>
                </form>
            </div>
        </div>
    </section>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="discusUser.js?v=2"></script>
<script src="auth.js"></script>
<script src="../assets/projectbar.js"></script>
</body>
</html>
